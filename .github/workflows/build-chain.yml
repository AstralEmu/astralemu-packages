name: Build Chain

on:
  workflow_call:
    inputs:
      chain_matrix:
        description: 'JSON array of matrix entries for this chain'
        required: true
        type: string
      cache_key:
        description: 'Base cache key for Docker images'
        required: false
        type: string
        default: 'emu-deps-base-v8'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ${{ matrix.entry.target_runner }}
    strategy:
      matrix:
        entry: ${{ fromJSON(inputs.chain_matrix) }}
      fail-fast: false
      max-parallel: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore cached image
        uses: actions/cache@v4
        with:
          path: /tmp/emu-deps.tar
          key: ${{ inputs.cache_key }}-${{ matrix.entry.target_arch }}

      - name: Load image
        run: docker load -i /tmp/emu-deps.tar

      - name: Restore ccache
        id: cache_ccache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}
          key: ccache-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}-${{ matrix.entry.version_short }}
          restore-keys: |
            ccache-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}-

      - name: Restore extra cache
        id: cache_extra
        if: matrix.entry.extra_cache_key != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.entry.extra_cache_path }}
          key: ${{ matrix.entry.extra_cache_key }}

      # Aggregators consume libretro-cores-* artifacts from libretro-heavy/
      # libretro-light. compute-chains.sh decides at prepare time whether to
      # pull them from this run's siblings (no fallback_run_id) or from a
      # previous successful run (fallback_run_id set when the deps are
      # marker-cached and the artifacts are still within retention).
      - name: Download aggregated artifacts (this run)
        if: matrix.entry.is_aggregator == 'true' && matrix.entry.fallback_run_id == ''
        uses: actions/download-artifact@v4
        with:
          pattern: "libretro-cores-*-${{ matrix.entry.target_id }}"
          path: cores/
          merge-multiple: true
        continue-on-error: true

      - name: Download aggregated artifacts (fallback run)
        if: matrix.entry.is_aggregator == 'true' && matrix.entry.fallback_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: "libretro-cores-*-${{ matrix.entry.target_id }}"
          path: cores/
          merge-multiple: true
          run-id: ${{ matrix.entry.fallback_run_id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      # Kernel aggregator (kernel-<target>) consumes the kernel-prep,
      # kernel-image, kernel-modules-* artifacts produced by its sub-jobs.
      # Single download with a wide kernel-*-<target> pattern + merge-multiple
      # lands them all into kernel-deps/ for the aggregator's build.sh.
      - name: Download kernel sub-job artifacts (this run)
        if: matrix.entry.is_aggregator == 'true' && startsWith(matrix.entry.emulator_id, 'kernel-') && matrix.entry.fallback_run_id == ''
        uses: actions/download-artifact@v4
        with:
          pattern: "kernel-*-${{ matrix.entry.target_id }}"
          path: kernel-deps/
          merge-multiple: true
        continue-on-error: true

      - name: Download kernel sub-job artifacts (fallback run)
        if: matrix.entry.is_aggregator == 'true' && startsWith(matrix.entry.emulator_id, 'kernel-') && matrix.entry.fallback_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: "kernel-*-${{ matrix.entry.target_id }}"
          path: kernel-deps/
          merge-multiple: true
          run-id: ${{ matrix.entry.fallback_run_id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      # Kernel image and module sub-jobs (kernel-<target>-image,
      # kernel-<target>-modules-soc, kernel-<target>-modules-generic) need
      # the patched source produced by kernel-<target>-prep. The aggregator
      # depends_on chain guarantees prep ran first; we just pull the tarball
      # and let the sub-job's build.sh extract it.
      - name: Download kernel-prep tarball
        if: matrix.entry.is_aggregator != 'true' && contains(matrix.entry.emulator_id, '-image') == false && contains(matrix.entry.emulator_id, '-modules-') == false
        run: echo "Not a kernel sub-job that needs prep"
      - name: Pull kernel-prep into the workspace
        if: matrix.entry.is_aggregator != 'true' && (contains(matrix.entry.emulator_id, '-image') || contains(matrix.entry.emulator_id, '-modules-'))
        uses: actions/download-artifact@v4
        with:
          # Strip the trailing -image / -modules-soc / -modules-generic to get
          # the matching prep artifact name (kernel-prep-kernel-<target>-prep-<target_id>).
          # The convention is documented in docs/kernel-integration-plan.md.
          pattern: "kernel-prep-*-${{ matrix.entry.target_id }}"
          path: kernel-prep-in/
          merge-multiple: true
        continue-on-error: true

      - name: Build
        id: build
        run: |
          mkdir -p /tmp/ccache-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}

          EXTRA_MOUNT=""
          if [[ -n "${{ matrix.entry.extra_cache_mount }}" ]]; then
            mkdir -p "${{ matrix.entry.extra_cache_path }}"
            EXTRA_MOUNT="-v ${{ matrix.entry.extra_cache_path }}:${{ matrix.entry.extra_cache_mount }}"
          fi

          # Capture stdout+stderr so the summary step can tail it on failure.
          BUILD_LOG="$RUNNER_TEMP/build.log"
          START_TS=$(date +%s)

          set +e
          docker run --rm --platform ${{ matrix.entry.target_platform }} \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -v /tmp/ccache-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}:/ccache \
            $EXTRA_MOUNT \
            -e VERSION=${{ matrix.entry.version }} \
            -e COMMIT=${{ matrix.entry.version }} \
            -e SHORT=${{ matrix.entry.version_short }} \
            -e CCACHE_DIR=/ccache \
            -e TARGET_ID=${{ matrix.entry.target_id }} \
            -e TARGET_ARCH=${{ matrix.entry.target_arch }} \
            -e TARGET_CFLAGS="${{ matrix.entry.target_cflags }}" \
            -e TARGET_CXXFLAGS="${{ matrix.entry.target_cxxflags }}" \
            -e TARGET_DEVICES="${{ matrix.entry.target_devices }}" \
            -e SOURCE_DISTRO=${{ matrix.entry.target_source_distro }} \
            emu-deps-image bash /workspace/${{ matrix.entry.base_dir }}/${{ matrix.entry.emulator_id }}/build.sh \
            2>&1 | tee "$BUILD_LOG"
          RC=${PIPESTATUS[0]}
          set -e

          END_TS=$(date +%s)
          DURATION=$((END_TS - START_TS))
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "rc=$RC" >> $GITHUB_OUTPUT
          echo "log_path=$BUILD_LOG" >> $GITHUB_OUTPUT

          # Check build-status files (emulator scripts write "completed" on success)
          EMU_ID="${{ matrix.entry.emulator_id }}"
          COMPLETED=false
          if [[ -f "build-status" ]] && [[ "$(cat build-status)" == "completed" ]]; then
            COMPLETED=true
          elif [[ -f "build-status-${EMU_ID##libretro-}" ]] && [[ "$(cat "build-status-${EMU_ID##libretro-}")" == "completed" ]]; then
            COMPLETED=true
          elif [[ "${{ matrix.entry.artifact_type }}" == "cores" ]] && ls cores-*/*.so 1>/dev/null 2>&1; then
            COMPLETED=true
          elif ls *.pkg.tar 1>/dev/null 2>&1; then
            COMPLETED=true
          fi
          # No timeout escape hatch anymore — every long build is split into
          # multi-job sub-steps via the aggregator pattern, so reaching the
          # GH Actions 6h hard limit means the build_time estimate was wrong
          # and the splitting needs revisiting. Fail explicitly so the run
          # surface shows it instead of being silently kept green.
          echo "completed=$COMPLETED" >> $GITHUB_OUTPUT
          if [[ "$COMPLETED" != "true" ]]; then
            echo "::error::Build failed for ${{ matrix.entry.emulator_id }}/${{ matrix.entry.target_id }} (rc=$RC, no artifact)"
            exit 1
          fi

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/ccache-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}
          key: ccache-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}-${{ matrix.entry.version_short }}

      - name: Save extra cache
        if: always() && matrix.entry.extra_cache_save == 'true' && matrix.entry.extra_cache_key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.entry.extra_cache_path }}
          key: ${{ matrix.entry.extra_cache_key }}

      - name: Upload pkg artifact
        if: steps.build.outputs.completed == 'true' && matrix.entry.artifact_type == 'pkg' && matrix.entry.noarch_single_build != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}
          path: "*.pkg.tar"
          retention-days: 1
          overwrite: true
          # Some entries (e.g. duckstation-deps) are helper steps that prep
          # a cache without emitting a .pkg.tar. Don't warn in that case.
          if-no-files-found: ignore

      - name: Upload pkg artifact (noarch, single build for all devices)
        if: steps.build.outputs.completed == 'true' && matrix.entry.artifact_type == 'pkg' && matrix.entry.noarch_single_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          # noarch_single_build entries iterate every device internally and
          # emit one arch=all .pkg.tar per device from a single build job.
          # The 'pkg-noarch-' prefix lets update-repos.yml pick this artifact
          # up for ALL device repos (any arch), not just the build_target the
          # job ran on.
          name: pkg-noarch-${{ matrix.entry.emulator_id }}
          path: "*.pkg.tar"
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      - name: Upload cores artifact
        if: steps.build.outputs.completed == 'true' && matrix.entry.artifact_type == 'cores'
        uses: actions/upload-artifact@v4
        with:
          name: libretro-cores-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}
          path: "cores-*/*.so"
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      # Kernel sub-job artifacts. Each artifact_type lands in a distinct
      # named slot so the aggregator (kernel-<target>) can download them
      # independently and merge:
      #   kernel-prep    : patched source tree + .config (shared by image
      #                    and module sub-jobs to avoid re-fetching/patching
      #                    the kernel source three times per target)
      #   kernel-image   : boot/{vmlinuz,bzImage} + DTBs (ARM)
      #   kernel-modules : lib/modules/<ver>/<subset>/  — uploaded by both
      #                    modules-soc and modules-generic sub-jobs; the
      #                    aggregator merges them by recursive copy.
      - name: Upload kernel-prep artifact
        if: steps.build.outputs.completed == 'true' && matrix.entry.artifact_type == 'kernel-prep'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-prep-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}
          path: kernel-prep.tar.zst
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      - name: Upload kernel-image artifact
        if: steps.build.outputs.completed == 'true' && matrix.entry.artifact_type == 'kernel-image'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}
          path: kernel-image-out/
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      - name: Upload kernel-modules artifact
        if: steps.build.outputs.completed == 'true' && matrix.entry.artifact_type == 'kernel-modules'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-modules-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}
          path: kernel-modules-out/
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      - name: Report build outcome
        if: always()
        run: |
          # Each chain job writes one row. The run's summary page shows all
          # rows concatenated, preceded by the "Build matrix" emitted by the
          # prepare job. Collapsible log block is attached on non-success.
          source scripts/report.sh
          report_section "Build · ${{ matrix.entry.emulator_id }} / ${{ matrix.entry.target_id }}"
          report_table "Status" "Duration" "Version" "Artifact"
          dur_s="${{ steps.build.outputs.duration }}"
          dur="${dur_s:-0}s"
          if (( dur_s > 60 )); then dur="$((dur_s/60))m$((dur_s%60))s"; fi
          case "${{ steps.build.outputs.completed }}" in
            true)
              report_row "SUCCESS" "$dur" \
                "${{ matrix.entry.version_short }}" \
                "pkg-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}"
              ;;
            false)
              report_row "FAIL" "$dur" \
                "${{ matrix.entry.version_short }}" \
                "rc=${{ steps.build.outputs.rc }}, no artifact"
              # Attach log tail so failures are diagnosable from the summary
              if [[ -s "${{ steps.build.outputs.log_path }}" ]]; then
                report_details \
                  "Build log tail (last 300 lines)" \
                  "$(tail -300 "${{ steps.build.outputs.log_path }}")"
              fi
              ;;
          esac
          report_table_end

          # Cache status — GitHub Actions doesn't expose whether actions/cache
          # /save succeeded from within the workflow, but we can at least
          # surface the restore hit/miss and the exact keys used, so any
          # "Cache save failed" warning visible in the run annotations can be
          # correlated to the right entry.
          report_note "**Caches**"
          report_table "Cache" "Key" "Restore"
          ccache_hit="${{ steps.cache_ccache.outputs.cache-hit }}"
          report_row "$([[ "$ccache_hit" == "true" ]] && echo CACHED || echo BUILT)" \
            "ccache" \
            "ccache-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}-${{ matrix.entry.version_short }}" \
            "${ccache_hit:-miss}"
          if [[ -n "${{ matrix.entry.extra_cache_key }}" ]]; then
            extra_hit="${{ steps.cache_extra.outputs.cache-hit }}"
            report_row "$([[ "$extra_hit" == "true" ]] && echo CACHED || echo BUILT)" \
              "extra (${{ matrix.entry.emulator_id }})" \
              "${{ matrix.entry.extra_cache_key }}" \
              "${extra_hit:-miss}"
          fi
          report_table_end

      - name: Save success marker
        if: steps.build.outputs.completed == 'true'
        run: mkdir -p /tmp/marker && echo ok > /tmp/marker/ok

      - name: Upload success marker
        if: steps.build.outputs.completed == 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/marker
          # target_id in the key so each build_target has its own marker —
          # otherwise 3 jobs (one per target) collide on the same cache
          # entry during save.
          key: success-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}-${{ matrix.entry.hash }}
