name: Build Chain

on:
  workflow_call:
    inputs:
      chain_matrix:
        description: 'JSON array of matrix entries for this chain'
        required: true
        type: string
      cache_key:
        description: 'Base cache key for Docker images'
        required: false
        type: string
        default: 'emu-deps-base-v5'
      build_timeout:
        description: 'Build timeout in seconds'
        required: false
        type: string
        default: '19800'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ${{ matrix.entry.target_runner }}
    strategy:
      matrix:
        entry: ${{ fromJSON(inputs.chain_matrix) }}
      fail-fast: false
      max-parallel: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore cached image
        uses: actions/cache@v4
        with:
          path: /tmp/emu-deps.tar
          key: ${{ inputs.cache_key }}-${{ matrix.entry.target_arch }}

      - name: Load image
        run: docker load -i /tmp/emu-deps.tar

      - name: Restore ccache
        id: cache_ccache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}
          key: ccache-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}-${{ matrix.entry.version_short }}
          restore-keys: |
            ccache-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}-

      - name: Restore extra cache
        id: cache_extra
        if: matrix.entry.extra_cache_key != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.entry.extra_cache_path }}
          key: ${{ matrix.entry.extra_cache_key }}

      - name: Download aggregated artifacts
        if: matrix.entry.is_aggregator == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: "libretro-cores-*-${{ matrix.entry.target_id }}"
          path: cores/
          merge-multiple: true
        continue-on-error: true

      - name: Build
        id: build
        run: |
          mkdir -p /tmp/ccache-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}

          EXTRA_MOUNT=""
          if [[ -n "${{ matrix.entry.extra_cache_mount }}" ]]; then
            mkdir -p "${{ matrix.entry.extra_cache_path }}"
            EXTRA_MOUNT="-v ${{ matrix.entry.extra_cache_path }}:${{ matrix.entry.extra_cache_mount }}"
          fi

          # Capture stdout+stderr so the summary step can tail it on failure.
          BUILD_LOG="$RUNNER_TEMP/build.log"
          START_TS=$(date +%s)

          set +e
          docker run --rm --platform ${{ matrix.entry.target_platform }} \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -v /tmp/ccache-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}:/ccache \
            $EXTRA_MOUNT \
            -e VERSION=${{ matrix.entry.version }} \
            -e COMMIT=${{ matrix.entry.version }} \
            -e SHORT=${{ matrix.entry.version_short }} \
            -e CCACHE_DIR=/ccache \
            -e BUILD_TIMEOUT=${{ inputs.build_timeout }} \
            -e TARGET_ID=${{ matrix.entry.target_id }} \
            -e TARGET_ARCH=${{ matrix.entry.target_arch }} \
            -e TARGET_CFLAGS="${{ matrix.entry.target_cflags }}" \
            -e TARGET_CXXFLAGS="${{ matrix.entry.target_cxxflags }}" \
            -e TARGET_DEVICES="${{ matrix.entry.target_devices }}" \
            -e SOURCE_DISTRO=${{ matrix.entry.target_source_distro }} \
            emu-deps-image bash /workspace/${{ matrix.entry.base_dir }}/${{ matrix.entry.emulator_id }}/build.sh \
            2>&1 | tee "$BUILD_LOG"
          RC=${PIPESTATUS[0]}
          set -e

          END_TS=$(date +%s)
          DURATION=$((END_TS - START_TS))
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "rc=$RC" >> $GITHUB_OUTPUT
          echo "log_path=$BUILD_LOG" >> $GITHUB_OUTPUT

          # Check build-status files (emulator scripts write "completed" on success)
          EMU_ID="${{ matrix.entry.emulator_id }}"
          if [[ -f "build-status" ]] && [[ "$(cat build-status)" == "completed" ]]; then
            echo "completed=true" >> $GITHUB_OUTPUT
          elif [[ -f "build-status-${EMU_ID##libretro-}" ]] && [[ "$(cat "build-status-${EMU_ID##libretro-}")" == "completed" ]]; then
            echo "completed=true" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.entry.artifact_type }}" == "cores" ]] && ls cores-*/*.so 1>/dev/null 2>&1; then
            echo "completed=true" >> $GITHUB_OUTPUT
          elif ls *.pkg.tar 1>/dev/null 2>&1; then
            echo "completed=true" >> $GITHUB_OUTPUT
          else
            echo "completed=false" >> $GITHUB_OUTPUT
          fi

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/ccache-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}
          key: ccache-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}-${{ matrix.entry.version_short }}

      - name: Save extra cache
        if: always() && matrix.entry.extra_cache_save == 'true' && matrix.entry.extra_cache_key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.entry.extra_cache_path }}
          key: ${{ matrix.entry.extra_cache_key }}

      - name: Upload pkg artifact
        if: steps.build.outputs.completed == 'true' && matrix.entry.artifact_type == 'pkg'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}
          path: "*.pkg.tar"
          retention-days: 1
          overwrite: true
          # Some entries (e.g. duckstation-deps) are helper steps that prep
          # a cache without emitting a .pkg.tar. Don't warn in that case.
          if-no-files-found: ignore

      - name: Upload cores artifact
        if: steps.build.outputs.completed == 'true' && matrix.entry.artifact_type == 'cores'
        uses: actions/upload-artifact@v4
        with:
          name: libretro-cores-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}
          path: "cores-*/*.so"
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      - name: Report build outcome
        if: always()
        run: |
          # Each chain job writes one row. The run's summary page shows all
          # rows concatenated, preceded by the "Build matrix" emitted by the
          # prepare job. Collapsible log block is attached on non-success.
          source scripts/report.sh
          report_section "Build · ${{ matrix.entry.emulator_id }} / ${{ matrix.entry.target_id }}"
          report_table "Status" "Duration" "Version" "Artifact"
          dur_s="${{ steps.build.outputs.duration }}"
          dur="${dur_s:-0}s"
          if (( dur_s > 60 )); then dur="$((dur_s/60))m$((dur_s%60))s"; fi
          case "${{ steps.build.outputs.completed }}" in
            true)
              report_row "SUCCESS" "$dur" \
                "${{ matrix.entry.version_short }}" \
                "pkg-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}"
              ;;
            false)
              report_row "FAIL" "$dur" \
                "${{ matrix.entry.version_short }}" \
                "rc=${{ steps.build.outputs.rc }}, no artifact"
              # Attach log tail so failures are diagnosable from the summary
              if [[ -s "${{ steps.build.outputs.log_path }}" ]]; then
                report_details \
                  "Build log tail (last 300 lines)" \
                  "$(tail -300 "${{ steps.build.outputs.log_path }}")"
              fi
              ;;
          esac
          report_table_end

          # Cache status — GitHub Actions doesn't expose whether actions/cache
          # /save succeeded from within the workflow, but we can at least
          # surface the restore hit/miss and the exact keys used, so any
          # "Cache save failed" warning visible in the run annotations can be
          # correlated to the right entry.
          report_note "**Caches**"
          report_table "Cache" "Key" "Restore"
          ccache_hit="${{ steps.cache_ccache.outputs.cache-hit }}"
          report_row "$([[ "$ccache_hit" == "true" ]] && echo CACHED || echo BUILT)" \
            "ccache" \
            "ccache-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}-${{ matrix.entry.version_short }}" \
            "${ccache_hit:-miss}"
          if [[ -n "${{ matrix.entry.extra_cache_key }}" ]]; then
            extra_hit="${{ steps.cache_extra.outputs.cache-hit }}"
            report_row "$([[ "$extra_hit" == "true" ]] && echo CACHED || echo BUILT)" \
              "extra (${{ matrix.entry.emulator_id }})" \
              "${{ matrix.entry.extra_cache_key }}" \
              "${extra_hit:-miss}"
          fi
          report_table_end

      - name: Save success marker
        if: steps.build.outputs.completed == 'true'
        run: mkdir -p /tmp/marker && echo ok > /tmp/marker/ok

      - name: Upload success marker
        if: steps.build.outputs.completed == 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/marker
          # target_id in the key so each build_target has its own marker —
          # otherwise 3 jobs (one per target) collide on the same cache
          # entry during save.
          key: success-${{ matrix.entry.emulator_id }}-${{ matrix.entry.target_id }}-${{ matrix.entry.hash }}
