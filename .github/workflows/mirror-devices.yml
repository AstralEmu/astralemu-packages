name: Mirror Package Sources

on:
  schedule:
    - cron: '0 3 * * 3'
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_deploy:
        description: 'Skip the final Pages deploy (set by rebuild-all.yml to avoid duplicate uploads)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mirror-sources
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ===========================================================================
  # MIRROR: Check all sources from devices.yml, detect new/changed packages
  # Outputs a matrix of ONLY devices with actual new packages
  # ===========================================================================
  mirror:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.process.outputs.matrix }}
      has_updates: ${{ steps.process.outputs.has_updates }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Process all sources from devices.yml
        id: process
        run: |
          mkdir -p .trackers
          MATRIX="[]"

          # Iterate devices with sources
          DEVICE_IDS=$(yq -r '.devices[] | select(.sources != null) | select(.sources | length > 0) | .id' devices.yml)

          for device_id in $DEVICE_IDS; do
            # source_distro now lives on build_targets — resolve via the device's build_target ref
            build_target=$(yq -r ".devices[] | select(.id == \"$device_id\") | .build_target" devices.yml)
            source_distro=$(yq -r ".build_targets[] | select(.id == \"$build_target\") | .source_distro" devices.yml)
            SOURCE_COUNT=$(yq -r ".devices[] | select(.id == \"$device_id\") | .sources | length" devices.yml)
            DEVICE_HAS_NEW=false

            echo ""
            echo "=== Device: $device_id ($SOURCE_COUNT source(s)) ==="
            mkdir -p "new-pkgs-${device_id}"

            for idx in $(seq 0 $((SOURCE_COUNT - 1))); do
              source_id=$(yq -r ".devices[] | select(.id == \"$device_id\") | .sources[$idx].id" devices.yml)
              source_url=$(yq -r ".devices[] | select(.id == \"$device_id\") | .sources[$idx].url" devices.yml)
              source_type=$(yq -r ".devices[] | select(.id == \"$device_id\") | .sources[$idx].type" devices.yml)
              source_format=$(yq -r ".devices[] | select(.id == \"$device_id\") | .sources[$idx].format" devices.yml)

              echo "--- Source: $source_id ($source_type) ---"

              # Check for new commits
              COMMIT_TRACKER=".trackers/${source_id}-commit"
              LATEST_COMMIT=$(git ls-remote "$source_url" HEAD | cut -f1)
              STORED_COMMIT=""
              if [ -f "$COMMIT_TRACKER" ]; then
                STORED_COMMIT=$(cat "$COMMIT_TRACKER")
              fi

              if [ "$LATEST_COMMIT" == "$STORED_COMMIT" ]; then
                echo "  No new commits (${LATEST_COMMIT:0:12})"
                continue
              fi

              echo "  New commits: ${STORED_COMMIT:0:12} -> ${LATEST_COMMIT:0:12}"
              echo "$LATEST_COMMIT" > "$COMMIT_TRACKER"

              # Clone source
              CLONE_DIR="/tmp/source-${source_id}"
              git clone --depth 1 "$source_url" "$CLONE_DIR"

              # Find package pattern
              case "$source_format" in
                deb)    PATTERN="*.deb" ;;
                rpm)    PATTERN="*.rpm" ;;
                pacman) PATTERN="*.pkg.tar.*" ;;
                *)      PATTERN="*.deb" ;;
              esac

              # Load previous hashes
              HASH_TRACKER=".trackers/${source_id}-hashes"
              declare -A OLD_HASHES=()
              if [ -f "$HASH_TRACKER" ]; then
                while IFS='=' read -r name hash; do
                  [[ -z "$name" ]] && continue
                  OLD_HASHES["$name"]="$hash"
                done < "$HASH_TRACKER"
              fi

              > "${HASH_TRACKER}.new"
              NEW_COUNT=0

              # Build search path list. Conventional layout has codename-
              # specific pools plus codename-agnostic 'main' subtrees:
              #   pool/<source_distro>/   — distro-specific binaries
              #   pool/main/              — codename-agnostic core
              #   pool/main-<variant>/    — codename-agnostic vendor variants
              #                              (e.g. l4t-debs ships pool/main-32-7/
              #                               for the R32.7 NVIDIA BSP)
              # If none of those exist, search the whole clone (flat repo).
              SEARCH_DIRS=()
              [ -d "$CLONE_DIR/pool/$source_distro" ] && SEARCH_DIRS+=("$CLONE_DIR/pool/$source_distro")
              shopt -s nullglob
              for d in "$CLONE_DIR/pool/main" "$CLONE_DIR/pool/main-"*/; do
                d="${d%/}"
                [ -d "$d" ] && SEARCH_DIRS+=("$d")
              done
              shopt -u nullglob
              if [ ${#SEARCH_DIRS[@]} -eq 0 ]; then
                SEARCH_DIRS+=("$CLONE_DIR")
              else
                echo "  Searching: ${SEARCH_DIRS[*]#$CLONE_DIR/}"
              fi

              # Optional include/exclude filters on the source (devices.yml).
              # include: if non-empty, only filenames matching at least one
              #          glob pattern survive (whitelist).
              # exclude: filenames matching any pattern are dropped after
              #          the include check (overrides). Use this to drop
              #          packages that match the include but aren't wanted
              #          (e.g. switch-flatpak inside a switch-* allowlist).
              INCLUDE_PATTERNS=$(yq -r ".devices[] | select(.id == \"$device_id\") | .sources[$idx].include // [] | .[]" devices.yml)
              EXCLUDE_PATTERNS=$(yq -r ".devices[] | select(.id == \"$device_id\") | .sources[$idx].exclude // [] | .[]" devices.yml)
              if [[ -n "$INCLUDE_PATTERNS" ]]; then
                echo "  include: $(echo "$INCLUDE_PATTERNS" | tr '\n' ' ')"
              fi
              if [[ -n "$EXCLUDE_PATTERNS" ]]; then
                echo "  exclude: $(echo "$EXCLUDE_PATTERNS" | tr '\n' ' ')"
              fi

              FILTERED_OUT=0
              for f in $(find "${SEARCH_DIRS[@]}" -name "$PATTERN"); do
                filename=$(basename "$f")
                safename="${filename//:/_}"

                # Package name is everything before the first underscore for
                # deb (e.g. "nvidia-l4t-core_32.7.5-foo_arm64.deb"), before
                # the first '-' followed by a digit for rpm/pacman.
                case "$source_format" in
                  deb)    pkgname="${safename%%_*}" ;;
                  pacman) pkgname=$(echo "$safename" | sed -E 's/-[0-9].*$//') ;;
                  rpm)    pkgname=$(echo "$safename" | sed -E 's/-[0-9].*$//') ;;
                  *)      pkgname="$safename" ;;
                esac

                if [[ -n "$INCLUDE_PATTERNS" ]]; then
                  matched=false
                  while IFS= read -r p; do
                    [[ -z "$p" ]] && continue
                    if [[ "$pkgname" == $p ]]; then matched=true; break; fi
                  done <<< "$INCLUDE_PATTERNS"
                  if [[ "$matched" != "true" ]]; then
                    FILTERED_OUT=$((FILTERED_OUT + 1))
                    continue
                  fi
                fi

                if [[ -n "$EXCLUDE_PATTERNS" ]]; then
                  excluded=false
                  while IFS= read -r p; do
                    [[ -z "$p" ]] && continue
                    if [[ "$pkgname" == $p ]]; then excluded=true; break; fi
                  done <<< "$EXCLUDE_PATTERNS"
                  if [[ "$excluded" == "true" ]]; then
                    FILTERED_OUT=$((FILTERED_OUT + 1))
                    continue
                  fi
                fi

                hash=$(sha256sum "$f" | cut -d' ' -f1)

                echo "${safename}=${hash}" >> "${HASH_TRACKER}.new"

                if [ "${OLD_HASHES[$safename]}" != "$hash" ]; then
                  cp "$f" "new-pkgs-${device_id}/$safename"
                  echo "  New/changed: $safename"
                  NEW_COUNT=$((NEW_COUNT + 1))
                fi
              done
              if (( FILTERED_OUT > 0 )); then
                echo "  filtered out $FILTERED_OUT package(s) by include/exclude"
              fi

              mv "${HASH_TRACKER}.new" "$HASH_TRACKER"
              rm -rf "$CLONE_DIR"

              if [ "$NEW_COUNT" -gt 0 ]; then
                DEVICE_HAS_NEW=true
                echo "  $NEW_COUNT new/changed package(s)"
              else
                echo "  All hashes match, no changes"
              fi
            done

            # Only add device to matrix if it has actual new packages
            if [ "$DEVICE_HAS_NEW" == "true" ]; then
              MATRIX=$(echo "$MATRIX" | jq -c ". + [{\"device_id\": \"$device_id\", \"source_distro\": \"$source_distro\", \"build_target\": \"$build_target\"}]")
              echo ">>> $device_id has new packages, added to build matrix"
            else
              rm -rf "new-pkgs-${device_id}"
            fi
          done

          echo ""
          echo "=== Matrix: $MATRIX ==="

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          if [ "$MATRIX" == "[]" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Install artifact SDK
        if: steps.process.outputs.has_updates == 'true'
        run: npm install @actions/artifact

      - name: Export artifact runtime variables
        if: steps.process.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'])
            core.exportVariable('ACTIONS_RUNTIME_URL', process.env['ACTIONS_RUNTIME_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      - name: Upload per-device package artifacts
        if: steps.process.outputs.has_updates == 'true'
        run: |
          node --input-type=module << 'SCRIPT'
          import {DefaultArtifactClient} from '@actions/artifact'
          import {readdirSync, statSync} from 'fs'
          import {resolve} from 'path'

          const client = new DefaultArtifactClient()
          const dirs = readdirSync('.').filter(d =>
            d.startsWith('new-pkgs-') && statSync(d).isDirectory()
          )

          for (const dir of dirs) {
            const deviceId = dir.replace('new-pkgs-', '')
            const files = []
            const walk = (d) => {
              for (const entry of readdirSync(d, {withFileTypes: true})) {
                const full = resolve(d, entry.name)
                if (entry.isDirectory()) walk(full)
                else files.push(full)
              }
            }
            walk(dir)

            if (files.length > 0) {
              console.log(`Uploading mirror-${deviceId}: ${files.length} file(s)`)
              const {id, size} = await client.uploadArtifact(`mirror-${deviceId}`, files, dir)
              console.log(`  -> artifact id=${id} size=${size}`)
            }
          }
          SCRIPT

      - name: Upload tracker data
        uses: actions/upload-artifact@v4
        with:
          name: mirror-trackers
          path: .trackers/*
          if-no-files-found: ignore
          retention-days: 1

      - name: Report mirror outcome
        if: always()
        run: |
          source scripts/report.sh
          report_section "Mirror sources"
          report_table "Status" "Device" "Source" "New packages"
          shopt -s nullglob
          for dir in new-pkgs-*; do
            device_id="${dir#new-pkgs-}"
            count=$(find "$dir" -type f 2>/dev/null | wc -l)
            status="ADDED"; (( count == 0 )) && status="SKIP"
            report_row "$status" "$device_id" "(all sources)" "$count"
          done
          # Devices with no new-pkgs-<id> dir had no changes at all
          for dev in $(yq -r '.devices[] | select(.sources != null) | select(.sources | length > 0) | .id' devices.yml); do
            [[ -d "new-pkgs-$dev" ]] && continue
            report_row "IGNORED" "$dev" "(all sources)" "0 (unchanged)"
          done
          report_table_end

  # ===========================================================================
  # UPDATE REPO: Convert and publish (only for devices with new packages)
  # ===========================================================================
  update-repo:
    needs: mirror
    if: needs.mirror.outputs.has_updates == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.mirror.outputs.matrix) }}
    uses: ./.github/workflows/update-repos.yml
    with:
      # Mirror pipeline only produces one per-device artifact (mirror-<id>); no
      # shared build_target artifacts. Pass the mirror artifact as "shared" and
      # a pattern that matches nothing for the device-specific slot.
      shared_artifact_pattern: mirror-${{ matrix.device_id }}
      device_artifact_pattern: __no_match_mirror__${{ matrix.device_id }}
      source_distro: ${{ matrix.source_distro }}
      device: ${{ matrix.device_id }}
      build_target: ${{ matrix.build_target }}
      force_rebuild: false
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  # ===========================================================================
  # SAVE TRACKERS: Update tracker files on main branch
  # ===========================================================================
  save-trackers:
    needs: [mirror, update-repo]
    if: "!cancelled() && needs.mirror.result == 'success'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download tracker data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mirror-trackers
          path: .trackers/

      - name: Save trackers to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .trackers/
          git commit -m "Update mirror trackers" || echo "No changes to commit"
          git push origin main

  # ===========================================================================
  # DEPLOY PAGES: Publish the final gh-pages state as a single Pages build.
  # Same rationale as in build-emulators.yml.
  # ===========================================================================
  deploy-pages:
    needs: update-repo
    if: "!cancelled() && !inputs.skip_deploy && needs.update-repo.result == 'success'"
    uses: ./.github/workflows/deploy-pages.yml
