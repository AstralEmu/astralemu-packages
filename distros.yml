# AstralEmu - Target distribution definitions
#
# Rolling LTS / latest tracking. The IDs below are stable aliases, NOT
# version-specific codenames — `ubuntu-lts` always points to the current
# Ubuntu LTS, `fedora-latest` always points to the current Fedora stable,
# etc. The Docker base images use rolling tags (`ubuntu:latest`,
# `fedora:latest`, `archlinux:latest`) so a new upstream release is picked
# up on the next CI run with no manual bump required.
#
# We only act on actual ABI breaks (libavcodec60 → libavcodec61 etc.) by
# rebuilding affected packages — the hash-only versioning + republish
# auto handles that.
#
# The `enabled` flag controls which distros the CI publishes to. Disabled
# distros stay defined here (the dep-map entries remain valid) but are
# skipped by compute-chains.sh and update-repos.yml. Flip to true to
# re-enable publication.

distros:
  apt:
    - id: ubuntu-lts
      enabled: true
      name: "Ubuntu LTS (latest)"
      type: ubuntu
      mirror: http://ports.ubuntu.com/ubuntu-ports
      components: "main universe"
    - id: debian-stable
      enabled: false
      name: "Debian stable (latest)"
      type: debian
      mirror: http://deb.debian.org/debian
      components: "main contrib"

  dnf:
    - id: fedora-latest
      enabled: true
      name: "Fedora (latest stable)"
      # Literal "latest" as a path segment under dnf/.../<version>/<arch>/.
      # Not substituted via $releasever — we publish a single rolling tree
      # rather than per-Fedora-version subdirs. Bump only on actual ABI
      # break, hash-only versioning + republish handles the rest.
      version: "latest"
      baseurl: https://mirrors.fedoraproject.org/metalink?repo=fedora-$releasever&arch=$basearch

  pacman:
    - id: arch
      enabled: false
      name: "Arch Linux"
      mirror: https://geo.mirror.pkgbuild.com
